<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>⚡ STAR FORGE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#080f26;touch-action:none;
    user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',sans-serif}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  .pe{pointer-events:auto}
  .brick-btn{pointer-events:auto;background:#F2CD37;color:#1B2A34;border:none;border-radius:11px;
    padding:14px 30px;font-size:18px;font-weight:bold;letter-spacing:1px;cursor:pointer;
    box-shadow:0 5px 0 #a8871c,0 8px 12px rgba(0,0,0,.45);transition:transform .07s,box-shadow .07s}
  .brick-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8871c,0 3px 6px rgba(0,0,0,.45)}
  .brick-btn.green{background:#57A93B;color:#fff;box-shadow:0 5px 0 #3a7527,0 8px 12px rgba(0,0,0,.45)}
  .brick-btn.green:active{box-shadow:0 1px 0 #3a7527,0 3px 6px rgba(0,0,0,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="err"></div>
<script>
// A thrown error used to leave a blank canvas and no way to tell why.
(function(){
 let shown=false;
 window.__oops=function(what,e){
  if(shown)return;shown=true;
  const d=document.getElementById('err');if(!d)return;
  d.style.cssText='position:fixed;inset:0;z-index:99;background:#0b1330;color:#fff;'+
   'font:13px/1.5 -apple-system,system-ui,sans-serif;padding:22px;overflow:auto;'+
   '-webkit-user-select:text;user-select:text';
  d.textContent='Star Forge hit a problem in '+what+':\n\n'+
   ((e&&(e.message||e))+'')+'\n\n'+((e&&e.stack)||'')+
   '\n\nscreen '+innerWidth+'x'+innerHeight+' dpr '+(devicePixelRatio||1)+
   '\n'+navigator.userAgent;
 };
 addEventListener('error',ev=>window.__oops('startup',ev.error||ev.message));
})();
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),ui=document.getElementById('ui');
let W,H,DPR;
// The build screen is static and is where the detail matters, so it renders at
// up to 3x device pixels. Flight needs 60fps and the ship is small, so it
// stays at 2x. If frames slip, both step down.
const DEV=()=>devicePixelRatio||1;
const HAS_FILTER=(function(){try{const t=document.createElement('canvas').getContext('2d');
 t.filter='blur(1px)';return t.filter!=='none'&&t.filter!==undefined;}catch(e){return false;}})();
// phones have far less canvas memory than a desktop; do not ask for 3x there
const TOUCHY=(function(){try{return matchMedia('(pointer:coarse)').matches;}catch(e){return false;}})();
let dprCap={build:TOUCHY?2:3,fly:2};
let wantDPR=Math.min(DEV(),dprCap.build);
function resize(){W=innerWidth;H=innerHeight;DPR=wantDPR;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);}
function applyDPR(d){if(Math.abs(d-DPR)<0.01)return;wantDPR=d;resize();}
addEventListener('resize',resize);resize();

/* ---------- sound ---------- */
let actx=null;
function audio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
function beep(f=440,d=0.08,t='square',v=0.15,slide=0){const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
const clackSound=()=>{beep(200,0.03,'square',0.16,-60);setTimeout(()=>beep(340,0.045,'square',0.2,-120),34);};
const snapSound=clackSound;
const scrollSound=()=>beep(260,0.035,'square',0.11,-70);
const grabSound=(p=0)=>beep(700+p*90,0.05,'sine',0.16,380);
const goldSound=()=>[880,1175,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.09,'sine',0.16),i*55));
const crashSound=()=>{beep(150,0.22,'square',0.2,-90);setTimeout(()=>beep(90,0.18,'square',0.14,-40),60);};
const bossHitSound=()=>beep(220,0.12,'square',0.18,-60);
const powerSound=()=>{beep(440,0.08,'square',0.16,220);setTimeout(()=>beep(660,0.08,'square',0.14,220),70);setTimeout(()=>beep(880,0.1,'square',0.12),140);};
const winSound=()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.16),i*80));

/* ---------- colour ---------- */
const _shc=new Map();
function shade(hex,amt){
  const k=hex+'|'+(amt=Math.round(amt*50)/50);let v=_shc.get(k);if(v)return v;
  if(hex[0]!=='#'){_shc.set(k,hex);return hex;}
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{const t=-amt;                      // toward a cool ambient, not toward black
    r=r*(1-t)+27*t;g=g*(1-t)+29*t;b=b*(1-t)+36*t;}
  v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';_shc.set(k,v);return v;
}
const _hrc=new Map();
function headroom(hex){                 // how much room a colour has before it clips
 let v=_hrc.get(hex);if(v!==undefined)return v;
 if(!hex||hex[0]!=='#'||hex.length<7){_hrc.set(hex,1);return 1;}
 const l=(parseInt(hex.slice(1,3),16)*0.299+parseInt(hex.slice(3,5),16)*0.587+
          parseInt(hex.slice(5,7),16)*0.114)/255;
 v=1-0.62*l*l;_hrc.set(hex,v);return v;
}
const hash2=(a,b)=>{const t=Math.sin(a*127.1+b*311.7)*43758.5453;return t-Math.floor(t);};
function hexA(hex,a){if(!hex||hex[0]!=='#'||hex.length<7)return hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return'rgba('+r+','+g+','+b+','+a+')';}
function glow(c,col,b){c.shadowColor=col;c.shadowBlur=b;}
function noGlow(c){c.shadowBlur=0;}

/* =======================================================================
   THE PIECE RENDERER
   One primitive does everything: an extruded polygon.
     {pts, y, h, hs?, ts?, ax?, c, r?, studs?, smooth?}
   ax 'y' (default) -- pts are (x,z) on the ground plane, extruded UP.
     A rectangle gives a brick. A swept quad gives a wedge plate.
     A 12-gon gives a round plate. hs sets each top corner's height,
     which is how slopes are made. ts tapers the top, giving cones.
   ax 'z'           -- pts are (x,y) upright, extruded BACKWARD along z.
     This is how engine nacelles and nose antennae are built.
   Units: x/z in studs, y in plates (3 plates = 1 brick).
   ======================================================================= */
const STUD=7, PLATE=STUD*0.4;
const TILT=0.58, RISE=0.92;
const CZ=12*STUD, CY=2.5*PLATE;
const nrm=v=>{const m=Math.hypot(v[0],v[1],v[2]);return[v[0]/m,v[1]/m,v[2]/m];};
const KEY=nrm([-0.34,0.86,0.38]);   // main light, high and to the left
const FILL=nrm([0.55,0.22,-0.55]);  // cool bounce filling the shadow side
const VIEW=nrm([0,TILT,RISE]);      // toward the camera
const HALF=nrm([KEY[0]+VIEW[0],KEY[1]+VIEW[1],KEY[2]+VIEW[2]]);

/* A tiny studio to mirror into the plastic: a big soft box overhead, a mid
   horizon, a dark floor. On a FLAT face under a directional light the Phong
   term is constant -- it can only tint the colour, which is why gloss painted
   that way reads as "a lighter shade of blue". What actually makes ABS look
   glossy in a photo is that it reflects the room, weighted by Fresnel. */
const ENV_TOP=[250,252,255], ENV_MID=[126,150,184], ENV_BOT=[24,32,50];
const GLOSS=0.82;
function envAt(ry){
 const t=ry<-1?-1:(ry>1?1:ry);
 if(t>=0){const k=Math.pow(t,0.55);
  return[ENV_MID[0]+(ENV_TOP[0]-ENV_MID[0])*k,
         ENV_MID[1]+(ENV_TOP[1]-ENV_MID[1])*k,
         ENV_MID[2]+(ENV_TOP[2]-ENV_MID[2])*k];}
 const k=Math.pow(-t,0.7);
 return[ENV_MID[0]+(ENV_BOT[0]-ENV_MID[0])*k,
        ENV_MID[1]+(ENV_BOT[1]-ENV_MID[1])*k,
        ENV_MID[2]+(ENV_BOT[2]-ENV_MID[2])*k];
}
const _envc=new Map();
const envCss=ry=>{const q=Math.round(ry*64);let v=_envc.get(q);if(v)return v;
 const e=envAt(q/64);v='rgb('+(e[0]|0)+','+(e[1]|0)+','+(e[2]|0)+')';_envc.set(q,v);return v;};

const rect=(x,z,w,d)=>[[x,z],[x+w,z],[x+w,z+d],[x,z+d]];
const px=(pts,y,h,c,r,o)=>Object.assign({pts,y,h,c,r},o);
const bx=(x,z,w,d,y,h,c,r,o)=>px(rect(x,z,w,d),y,h,c,r,o);
// rect corner order is NW,NE,SE,SW with N = nose (small z)
const SLOPES={n:(h,l)=>[l,l,h,h], s:(h,l)=>[h,h,l,l], w:(h,l)=>[l,h,h,l], e:(h,l)=>[h,l,l,h]};
const sl=(x,z,w,d,y,h,dir,c,r,o)=>px(rect(x,z,w,d),y,h,c,r,
   Object.assign({hs:SLOPES[dir](h,(o&&o.lo)||0),studs:false},o));
function ring(cx,cz,rad,n){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
  p.push([cx+Math.cos(a)*rad,cz+Math.sin(a)*rad]);}return p;}
// vertical cylinder / cone
const cyl=(cx,cz,rad,y,h,c,r,o)=>px(ring(cx,cz,rad,(o&&o.n)||12),y,h,c,r,
   Object.assign({studs:false,smooth:true},o));
// horizontal cylinder along z -- engine nacelles, antennae, gun barrels
const tube=(cx,cy_,rad,z,len,c,r,o)=>px(ring(cx,cy_,rad,(o&&o.n)||12),z,len,c,r,
   Object.assign({ax:'z',studs:false,smooth:true},o));

function newell(P){let x=0,y=0,z=0;
 for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
  x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1]);}
 const m=Math.hypot(x,y,z)||1;return[x/m,y/m,z/m];}

/* Clip a footprint polygon to one grid cell (Sutherland-Hodgman). Used to cut
   big faces into pieces small enough that depth ordering is local. */
let CELL=1.2;   // studs. Smaller sorts better and costs more faces.
function clipCell(poly,x0,x1,z0,z1){
 const ins=(q,e)=>e===0?q[0]>=x0:e===1?q[0]<=x1:e===2?q[1]>=z0:q[1]<=z1;
 const cut=(a,b,e)=>{let t;
  if(e===0)t=(x0-a[0])/(b[0]-a[0]);else if(e===1)t=(x1-a[0])/(b[0]-a[0]);
  else if(e===2)t=(z0-a[1])/(b[1]-a[1]);else t=(z1-a[1])/(b[1]-a[1]);
  return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];};
 let out=poly;
 for(let e=0;e<4&&out.length;e++){
  const inp=out;out=[];
  for(let i=0;i<inp.length;i++){
   const a=inp[(i+inp.length-1)%inp.length],b=inp[i];
   const ia=ins(a,e),ib=ins(b,e);
   if(ib){if(!ia)out.push(cut(a,b,e));out.push(b);}
   else if(ia)out.push(cut(a,b,e));}}
 return out;
}
// is the segment a-b part of the outline of poly? (its midpoint sits on one
// of poly's own edges)
function onEdge(poly,a,b){
 const mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2;
 for(let i=0;i<poly.length;i++){
  const u=poly[i],v=poly[(i+1)%poly.length];
  const dx=v[0]-u[0],dz=v[1]-u[1],L2=dx*dx+dz*dz;
  if(L2<1e-12)continue;
  let t=((mx-u[0])*dx+(mz-u[1])*dz)/L2;
  if(t<0)t=0;else if(t>1)t=1;
  const ex=u[0]+dx*t-mx,ez=u[1]+dz*t-mz;
  if(ex*ex+ez*ez<1e-7)return true;
 }
 return false;
}
const polyArea=q=>{let a=0;for(let i=0;i<q.length;i++){const b=q[(i+1)%q.length];
 a+=q[i][0]*b[1]-b[0]*q[i][1];}return Math.abs(a)*0.5;};
function pieceGeom(p){
 if(p._g)return p._g;
 const n=p.pts.length,ts=p.ts===undefined?1:p.ts,ax=p.ax||'y';
 let cu=0,cv=0;for(const q of p.pts){cu+=q[0];cv+=q[1];}cu/=n;cv/=n;
 const map=ax==='y'?(u,v,w)=>[u*STUD,w*PLATE-CY,v*STUD-CZ]
                   :(u,v,w)=>[u*STUD,v*PLATE-CY,w*STUD-CZ];
 const V=[];
 for(let i=0;i<n;i++)V.push(map(p.pts[i][0],p.pts[i][1],p.y));
 for(let i=0;i<n;i++){const q=p.pts[i],th=p.hs?p.hs[i]:p.h;
   V.push(map(cu+(q[0]-cu)*ts,cv+(q[1]-cv)*ts,p.y+th));}
 const C=[0,0,0];for(const v of V){C[0]+=v[0];C[1]+=v[1];C[2]+=v[2];}
 for(let k=0;k<3;k++)C[k]/=V.length;    // centre of the solid, before any splitting
 let anySplit=false;
 /* A big flat top cannot be sorted as one unit. Depth ordering says a brick
    standing on the far end of a deck is further away than the deck's centre,
    so the deck gets painted over it -- which is the large blank panel that
    kept appearing across the hull as it turned. Splitting a large top into
    cells makes each one's depth local, and then a brick is always nearer than
    the cell it is standing on. */
 let subdiv=false;
 const F=[];
 // Any flat top big enough to matter gets cut into cells -- not just the
 // axis-aligned ones. The wing plates are the largest faces on the model and
 // they are arbitrary polygons, so restricting this to rectangles left the
 // worst offenders whole.
 if(!p.hs&&ts===1&&ax==='y'){
   const xs=p.pts.map(q=>q[0]),zs=p.pts.map(q=>q[1]);
   const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
   const z0=Math.min.apply(null,zs),z1=Math.max.apply(null,zs);
   const w=x1-x0,d=z1-z0;
   if(w*d>9){
     const nx=Math.ceil(w/CELL),nz=Math.ceil(d/CELL);
     for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
       const cp=clipCell(p.pts,x0+w*i/nx,x0+w*(i+1)/nx,z0+d*j/nz,z0+d*(j+1)/nz);
       if(cp.length<3||polyArea(cp)<0.02)continue;
       const k0=V.length;
       for(const q of cp)V.push(map(q[0],q[1],p.y+p.h));
       // Only the cell edges that fall on the brick's real outline get a
       // chamfer; the cut edges between cells must not, or the split shows as
       // a grid drawn across the face.
       const bnd=cp.map((q,t)=>onEdge(p.pts,q,cp[(t+1)%cp.length]));
       F.push({i:cp.map((_,t)=>k0+t),cap:true,cell:true,bnd});
     }
     if(F.length){subdiv=true;anySplit=true;}else F.length=0;
   }
 }
 const origCap={i:Array.from({length:n},(_,k)=>n+k),cap:true};
 if(!subdiv)F.push(origCap);
 // A long wall has the same problem as a wide deck: one depth for the whole
 // run, so anything standing in front of its far end sorts behind it.
 for(let i=0;i<n;i++){
   const j=(i+1)%n;
   const a=p.pts[i],b2=p.pts[j];
   const run=Math.hypot(b2[0]-a[0],b2[1]-a[1]);
   const segs=(!p.hs&&ts===1&&run>CELL*1.3)?Math.min(8,Math.ceil(run/(CELL*1.1))):1;
   if(segs===1){F.push({i:[i,j,n+j,n+i],side:true});continue;}
   anySplit=true;
   const lo=V[i],hi=V[n+i],lo2=V[j],hi2=V[n+j];
   let pb=i,pt=n+i;
   for(let t=1;t<=segs;t++){
     const u=t/segs;
     let nb,nt;
     if(t===segs){nb=j;nt=n+j;}
     else{
       nb=V.length;V.push([lo[0]+(lo2[0]-lo[0])*u,lo[1]+(lo2[1]-lo[1])*u,lo[2]+(lo2[2]-lo[2])*u]);
       nt=V.length;V.push([hi[0]+(hi2[0]-hi[0])*u,hi[1]+(hi2[1]-hi[1])*u,hi[2]+(hi2[2]-hi[2])*u]);
     }
     F.push({i:[pb,nb,nt,pt],side:true,cell:true,bnd:[true,t===segs,true,t===1]});
     pb=nb;pt=nt;
   }
 }
 for(const f of F){
   const poly=f.i.map(k=>V[k]),nr=newell(poly);
   const fc=[0,0,0];for(const v of poly){fc[0]+=v[0];fc[1]+=v[1];fc[2]+=v[2];}
   for(let k=0;k<3;k++)fc[k]/=poly.length;
   if((fc[0]-C[0])*nr[0]+(fc[1]-C[1])*nr[1]+(fc[2]-C[2])*nr[2]<0){nr[0]*=-1;nr[1]*=-1;nr[2]*=-1;}
   f.n=nr;
 }
 return p._g={V,F,C,subdiv};
}
// a face shows when its normal turns back toward the camera at (0,-TILT,-RISE)
function faceLit(n,cs,sn){
 const rx=n[0]*cs+n[2]*sn,ry=n[1],rz=-n[0]*sn+n[2]*cs;
 const k=Math.max(0,rx*KEY[0]+ry*KEY[1]+rz*KEY[2]);
 const f=Math.max(0,rx*FILL[0]+ry*FILL[1]+rz*FILL[2]);
 // ABS is glossy: a tight highlight where the face turns the light at the eye
 const h=Math.max(0,rx*HALF[0]+ry*HALF[1]+rz*HALF[2]);
 const h2=h*h,h4=h2*h2,h8=h4*h4;
 // Two lobes. The BROAD one is the soft box every LEGO photo is lit with --
 // h^16 only fires on faces pointed exactly at the light, which left the top
 // of every brick matte. The tight one is the glint off a chamfer or a curve.
 const broad=h4*h, tight=h8*h8*h8;
 // how edge-on the face is to the eye. Plastic goes bright and milky at a
 // grazing angle -- that Fresnel roll-off is most of what says "shiny".
 const dot=(-TILT*ry-RISE*rz)/1.087;
 const c1=1-Math.min(1,Math.abs(dot));
 const c5=c1*c1*c1*c1*c1;
 const fres=0.04+0.96*c5;             // Schlick, F0 = 0.04 for a dielectric
 // mirror direction: R = 2(N.V)N - V. Only its height matters to the studio.
 const nv=ry*VIEW[1]+rz*VIEW[2];
 const rry=2*nv*ry-VIEW[1];
 return{vis:dot<0,k,
        s:-0.47+0.62*k+0.12*f+0.10*h4,
        spec:broad*0.50+tight*0.85,   // soft box, plus a hot core on the bevels
        broad,
        fres,                          // raw Schlick, for the reflection lerp
        ry:rry};
}
/* A real camera, not a game camera. Pure axonometric keeps every edge
   parallel, which is a large part of why a render reads as CG: a photograph
   of something this small converges -- the far edge of the plate is visibly
   shorter than the near one. CAMD is the camera distance in the same units as
   the geometry; larger is a longer lens. Sorting still uses depth(), which is
   unaffected, and a planar face stays planar under a perspective divide, so
   nothing downstream changes. */
let CAMD=1020;
try{Object.defineProperty(window,'__CAMD',{set:v=>{CAMD=v;},get:()=>CAMD});}catch(e){}
const prj=(v,cs,sn)=>{
 const zz=-v[0]*sn+v[2]*cs;
 const k=CAMD/(CAMD-(TILT*v[1]+RISE*zz));
 return[(v[0]*cs+v[2]*sn)*k,(zz*TILT-v[1]*RISE)*k];};
const bbox=pts=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;
 for(const q of pts){if(q[0]<a)a=q[0];if(q[0]>c)c=q[0];if(q[1]<b)b=q[1];if(q[1]>d)d=q[1];}
 return[a,b,c,d];};
function inPoly(pts,x,z){let hit=false;
 for(let i=0,j=pts.length-1;i<pts.length;j=i++){
   const a=pts[i],b=pts[j];
   if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])hit=!hit;}
 return hit;}
function studCovered(all,p,sx,sz){const top=p.y+p.h;
 for(const o of all){if(o===p||(o.ax||'y')!=='y')continue;
   const oh=o.hs?Math.max.apply(null,o.hs):o.h;
   if(!(o.y<=top+0.05&&o.y+oh>top+0.05))continue;
   const bb=o._bb||(o._bb=bbox(o.pts));
   if(sx>bb[0]&&sx<bb[2]&&sz>bb[1]&&sz<bb[3])return true;}
 return false;}

let SORTK=0;   // 0 = face centroid. Sliding toward the nearest corner was measured and does not help.
function drawPieces(c,pieces,TH,yaw,depthPass){
 const cs=Math.cos(yaw),sn=Math.sin(yaw);
 const depth=v=>TILT*v[1]+RISE*(-v[0]*sn+v[2]*cs);
 // where the key light sits in screen space at this angle
 const lp=prj([KEY[0]*40,KEY[1]*40,KEY[2]*40],cs,sn),lm=Math.hypot(lp[0],lp[1])||1;
 const LDIR=[lp[0]/lm,lp[1]/lm];
 const items=[];

/* ---------- sprite cache: a model is drawn once per viewing angle ---------- */
const SPR=new Map();
function makeSprite(pieces,TH,yaw,SS,dof){
 SS=SS||2;
 if(!pieces.length){const e=document.createElement('canvas');e.width=e.height=1;
   return{cv:e,ox:0,oy:0,w:1,h:1,empty:true};}
 const cs=Math.cos(yaw),sn=Math.sin(yaw);
 let ax=1e9,bx2=-1e9,ay=1e9,by=-1e9;
 for(const p of pieces)for(const v of pieceGeom(p).V){const q=prj(v,cs,sn);
   if(q[0]<ax)ax=q[0];if(q[0]>bx2)bx2=q[0];if(q[1]<ay)ay=q[1];if(q[1]>by)by=q[1];}
 ay-=STUD*0.55;
 const pad=4,w=Math.ceil(bx2-ax)+pad*2,h=Math.ceil(by-ay)+pad*2;
 const cv=document.createElement('canvas');
 cv.width=Math.max(1,w*SS);cv.height=Math.max(1,h*SS);
 const g=cv.getContext('2d');g.setTransform(SS,0,0,SS,0,0);
 g.translate(-ax+pad,-ay+pad);
 drawPieces(g,pieces,TH,yaw);
 applyAO(cv,pieces,TH,yaw,SS,ax,ay,pad,dof);
 return{cv,ox:ax-pad,oy:ay-pad,w,h};
}
// Contact shadows. Render the same geometry once more as flat depth, then
// darken each pixel by how much of the hemisphere around it is blocked by
// something nearer. This is what a photo has in every crevice and under every
// stud, and its absence is most of what read as "computer graphics".
const AO_DIRS=(function(){const d=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2+0.19;
 d.push([Math.cos(a),Math.sin(a)]);}return d;})();
function applyAO(cv,pieces,TH,yaw,SS,ax,ay,pad,dof){
 // AO is low-frequency, so compute it at a fixed budget instead of scaling
 // with the sprite -- a 6x desktop bake costs the same as a 2x one
 const AOMAX=560,k=Math.min(0.5,AOMAX/Math.max(cv.width,cv.height));
 const dw=Math.max(2,Math.round(cv.width*k)),dh=Math.max(2,Math.round(cv.height*k));
 const dcv=applyAO.scratch||(applyAO.scratch=document.createElement('canvas'));
 dcv.width=dw;dcv.height=dh;
 const dg=dcv.getContext('2d',{willReadFrequently:true});
 dg.setTransform(1,0,0,1,0,0);dg.clearRect(0,0,dw,dh);
 dg.setTransform(SS*k,0,0,SS*k,0,0);dg.translate(-ax+pad,-ay+pad);
 drawPieces(dg,pieces,TH,yaw,true);
 let src;try{src=dg.getImageData(0,0,dw,dh).data;}catch(e){return;}
 const R=Math.max(2,Math.round(Math.min(dw,dh)*0.026)),BIAS=9;
 const ao=document.createElement('canvas');ao.width=dw;ao.height=dh;
 const ag=ao.getContext('2d');
 const out=ag.createImageData(dw,dh),o=out.data;
 for(let y=0;y<dh;y++)for(let x=0;x<dw;x++){
   const i=(y*dw+x)*4;
   if(src[i+3]===0)continue;                    // nothing here
   const d0=src[i];let occ=0,n=0;
   for(let r=1;r<=2;r++){const rad=R*(r===1?0.45:1);
     for(const dir of AO_DIRS){
       const sx=(x+dir[0]*rad)|0,sy=(y+dir[1]*rad)|0;
       if(sx<0||sy<0||sx>=dw||sy>=dh)continue;
       const j=(sy*dw+sx)*4;n++;
       if(src[j+3]===0)continue;
       if(src[j]>d0+BIAS)occ+=Math.min(1,(src[j]-d0-BIAS)/17);
     }}
   if(!n)continue;
   const a=Math.min(0.52,(occ/n)*1.7);
   o[i+3]=(a*255)|0;                            // black at that alpha = multiply

 c2.save();c2.setTransform(1,0,0,1,0,0);
 c2.globalCompositeOperation='multiply';
 c2.drawImage(ao,0,0,cv.width,cv.height);       // upscale doubles as the blur
 c2.restore();
 // Depth of field went in here and came straight back out: as the model
 // turned, different pieces crossed the focal plane and their detail winked in
 // and out. Correct for a camera, wrong for something you spin in your hand.

}
/* Light bounces between the bricks. A white plate beside a red brick picks up
   a little red in a photograph, and the absence of that is part of why every
   piece looks like it was cut out and pasted down. A blurred copy of the
   model, masked back to its own silhouette and added at a low weight, is the
   cheap standing-in for a bounce pass -- additive, which is the right form,
   just without knowing which surface it came from. */
function applyBounce(cv,SS){
 if(!HAS_FILTER)return;
 const t=document.createElement('canvas');
 t.width=cv.width;t.height=cv.height;
 const g=t.getContext('2d');
 g.filter='blur('+Math.max(2,3.2*SS).toFixed(1)+'px)';
 g.drawImage(cv,0,0);
 g.filter='none';
 g.globalCompositeOperation='destination-in';   // keep it inside the model
 g.drawImage(cv,0,0);

 c4.save();c4.setTransform(1,0,0,1,0,0);
 c4.globalCompositeOperation='lighter';c4.globalAlpha=0.03;
 c4.drawImage(t,0,0);
 c4.restore();
}
function sprite(key,pieces,TH,yaw,SS,dof){

 if(SPR.size>36){SPR.clear();SPR.set(key,s);}

}
// mirror a set of pieces across the centreline
const mirX=ps=>ps.concat(ps.map(p=>{

 if((p.ax||'y')==='y'){q.pts=p.pts.map(a=>[-a[0],a[1]]).reverse();
   if(p.hs)q.hs=p.hs.slice().reverse();}

const offX=(ps,dx)=>ps.map(p=>{const q=Object.assign({},p);

   Every hull is 3 studs half-width at z=7 and z=18, so any nose and any
   engine mate with any hull. Wings are drawn from x=0 outward and shifted
   onto whatever edge the hull declares, so nothing floats or clips.

const METAL={};METAL[SILVER]=1;METAL[DGREY]=1;METAL[STONE]=1;METAL[BLACK]=1;
function tintPart(o){
 if(!o.pal||!o.pieces||!o.pieces.length)return;
 o.pieces=o.pieces.map(q=>{
  if(q.r==='glass')return q;
  if(METAL[q.c]&&(q.r==='light'||q.r==='dark'))return q;   // fittings stay metal
  const c=o.pal[q.r];
  if(!c||c===q.c)return q;
  const n=Object.assign({},q,{c});delete n._g;delete n._bb;return n;
 });
}

// a four-blade propeller, seen from above
const prop=(cx,cz,y,rad,col,role)=>{
 const o=[];
 for(let i=0;i<4;i++){
  const a=i*Math.PI/2+0.42,ca=Math.cos(a),sa=Math.sin(a),w=0.62;
  o.push(px([[cx+ca*0.55-sa*w, cz+sa*0.55+ca*w],
             [cx+ca*rad-sa*w*0.45, cz+sa*rad+ca*w*0.45],
             [cx+ca*rad+sa*w*0.45, cz+sa*rad-ca*w*0.45],
             [cx+ca*0.55+sa*w, cz+sa*0.55-ca*w]],y,0.5,col,role||'accent',{studs:false}));
 }
 o.push(cyl(cx,cz,0.5,y-0.5,1.6,DGREY,'light',{n:8}));
 return o;
};

// defence sits on the deck, so it shifts in y and z rather than x
const placeZ=(ps,dy,dz)=>ps.map(p=>{
 const q=Object.assign({},p);delete q._g;delete q._bb;
 if((p.ax||'y')==='y'){q.pts=p.pts.map(a=>[a[0],a[1]+dz]);q.y=p.y+dy;}
 else{q.pts=p.pts.map(a=>[a[0],a[1]+dy]);q.y=p.y+dz;}
 return q;});
const place=(ps,dx,dy)=>ps.map(p=>{
 const q=Object.assign({},p);delete q._g;delete q._bb;
 if((p.ax||'y')==='y'){q.pts=p.pts.map(a=>[a[0]+dx,a[1]]);q.y=p.y+dy;}
 else{q.pts=p.pts.map(a=>[a[0]+dx,a[1]+dy]);}
 return q;});

function shipPieces(){
 const hull=ship.body>=0?BODIES[ship.body]:null;
 const hw=hull?hull.halfW:4,wy=hull?hull.wingY:2,
       dy=hull?hull.defY:4,dz=hull?hull.defZ:8.6,
       ty=hull?hull.tailY:4,tz=hull?hull.tailZ:15.2;
 let out=hull?hull.pieces.slice():[];
 if(ship.cockpit>=0){const C=COCKPITS[ship.cockpit];out=out.concat(C.pieces);
   if(ship.pilot>=0&&C.seat)out=out.concat(pilotAt(C.seat[0],C.seat[1],C.seat[2],PILOTS[ship.pilot]));}
 if(ship.wings>=0){const w=WINGS[ship.wings].pieces;
   if(w.length)out=out.concat(mirX(place(w,hw,wy)));}
 if(ship.engine>=0)out=out.concat(ENGINES[ship.engine].pieces);
 if(ship.defense>=0)out=out.concat(placeZ(DEFENSES[ship.defense].pieces,dy,dz));
 return out;

// exactly the device pixels one model unit will occupy, so drawImage maps
// 1:1 and nothing is resampled on the way to the screen
const bakeSS=s=>Math.round(Math.max(1.5,Math.min(8,s*(DPR||1)))*100)/100;
/* Exhaust leaves along the ship's own tail axis, not straight down the screen.
   The old flame ignored yaw entirely, so as the model turned the nacelles
   pointed one way and the fire went another -- which is why it never looked
   like it was coming out of anything. It also re-rolled Math.random() every
   frame for its flicker, which is the jitter. (dx,dy) is the tail direction
   already projected, so yaw and the perspective divide are both accounted for. */
function thruster(c,x,y,dx,dy,r,t,C,seed){
  if(t<=0)return;
  const now=(typeof performance!=='undefined'?performance.now():Date.now())*0.001;
  const flick=0.88+0.12*Math.sin(now*17+seed)+0.06*Math.sin(now*29.3+seed*2.1);
  const col=C.flame2||C.glow, hot=C.flame||'#fff';
  const len=(2.3+1.7*t)*r*flick, w=r*0.86;
  const px=-dy,py=dx;                        // across the plume
  const tx=x+dx*len, ty=y+dy*len;
  c.save();c.globalCompositeOperation='lighter';
  const R=r*1.9;c.globalAlpha=0.42;          // a bloom at the mouth, not a haze
  c.drawImage(haloImg(col),x+dx*r*0.5-R,y+dy*r*0.5-R,R*2,R*2);c.globalAlpha=1;
  const g=c.createLinearGradient(x,y,tx,ty);
  g.addColorStop(0,hot);g.addColorStop(0.3,col);g.addColorStop(1,'rgba(255,60,0,0)');
  c.fillStyle=g;c.beginPath();
  c.moveTo(x+px*w,y+py*w);
  c.quadraticCurveTo(x+dx*len*0.55+px*w*0.42,y+dy*len*0.55+py*w*0.42,tx,ty);
  c.quadraticCurveTo(x+dx*len*0.55-px*w*0.42,y+dy*len*0.55-py*w*0.42,x-px*w,y-py*w);
  c.closePath();c.fill();
  const cw=w*0.42,cl=len*0.55;               // the white core
  c.fillStyle='rgba(255,255,255,0.85)';c.beginPath();
  c.moveTo(x+px*cw,y+py*cw);
  c.quadraticCurveTo(x+dx*cl*0.5,y+dy*cl*0.5,x+dx*cl,y+dy*cl);
  c.quadraticCurveTo(x+dx*cl*0.5,y+dy*cl*0.5,x-px*cw,y-py*cw);
  c.closePath();c.fill();
  c.restore();}
function drawShip(c,x,y,s,t=0.6,yaw=0,dof){
 const sp=shipSprite(yaw,bakeSS(s),dof),pal=THEMES[ship.theme];
 if(sp.empty)return;
 c.save();c.translate(x,y);c.scale(s,s);
 if(t>0&&ship.engine>=0){const cs=Math.cos(yaw),sn=Math.sin(yaw);
   for(const n of ENGINES[ship.engine].nozzles){
     const q=prj([n.x*STUD,n.y*PLATE-CY,n.z*STUD-CZ],cs,sn);
     // one step further back tells us which way "out of the nozzle" points
     const q2=prj([n.x*STUD,n.y*PLATE-CY,(n.z+6)*STUD-CZ],cs,sn);
     let dx=q2[0]-q[0],dy=q2[1]-q[1];
     const m=Math.hypot(dx,dy);
     if(m<0.001){dx=0;dy=1;}else{dx/=m;dy/=m;}
     thruster(c,q[0],q[1],dx,dy,n.r,t,pal,n.x*7.3+n.z*1.7);}}
 c.drawImage(sp.cv,sp.ox,sp.oy,sp.w,sp.h);
 c.restore();
}
// a black silhouette of the sprite, squashed onto the ground plane
const SHADOW=new Map();
function shadowOf(sp,key){
 let sh=SHADOW.get(key);if(sh)return sh;
 const pad=Math.ceil(Math.max(sp.cv.width,sp.cv.height)*0.05)+6;
 const c=document.createElement('canvas');
 c.width=sp.cv.width+pad*2;c.height=sp.cv.height+pad*2;
 const g=c.getContext('2d');
 g.drawImage(sp.cv,pad,pad);
 g.globalCompositeOperation='source-in';g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);
 // soften it here, once, and at a third the resolution -- it is a blurred
 // silhouette, so the per-frame blit has no business being full size
 const q=1/3;
 const bl=document.createElement('canvas');
 bl.width=Math.max(1,Math.round(c.width*q));bl.height=Math.max(1,Math.round(c.height*q));
 const bg=bl.getContext('2d');
 if(HAS_FILTER)bg.filter='blur('+Math.max(1.5,pad*0.4*q).toFixed(1)+'px)';
 bg.drawImage(c,0,0,bl.width,bl.height);
 bl.pad=pad;sh=bl;SHADOW.set(key,sh);
 if(SHADOW.size>16)SHADOW.clear();
 return sh;}
/* The pad frames whatever is standing on it. A fixed 30x31 plate dwarfed the
   small ships, which pushed the whole model down to a fifth of the screen --
   at that size none of the brickwork is legible however well it is lit. */
const _fpc=new Map(), _bpc=new Map();
function shipFootprint(){
 const key=[ship.cockpit,ship.wings,ship.body,ship.engine,ship.tail].join(',');
 let f=_fpc.get(key);if(f)return f;
 let hw=6,z0=1e9,z1=-1e9,top=6;
 for(const pc of shipPieces())for(const v of pieceGeom(pc).V){
  const x=Math.abs(v[0])/STUD, z=(v[2]+CZ)/STUD, y=(v[1]+CY)/PLATE;
  if(x>hw)hw=x; if(z<z0)z0=z; if(z>z1)z1=z; if(y>top)top=y;
 }
 if(z0>z1){z0=0;z1=12;}
 // wings are allowed to hang off the pad -- they do on a real display stand,
 // and a pad sized to the full wingspan is what was shrinking the model
 f={hw:Math.min(Math.ceil(hw)+1,13), z0:Math.floor(z0)-2, z1:Math.ceil(z1)+2, top};
 if(f.z1-f.z0<14){const c=(f.z0+f.z1)/2;f.z0=Math.round(c-7);f.z1=f.z0+14;}
 if(f.z1-f.z0>30){const c=(f.z0+f.z1)/2;f.z0=Math.round(c-15);f.z1=f.z0+30;}
 if(f.hw<8)f.hw=8;
 // true projected bounds of pad + model, taken over every yaw the spin snaps
 // to, so one scale serves the whole rotation and nothing clips at 45 degrees
 const all=SHOW_PAD?shipPieces().concat(plateOf(f)):shipPieces();
 let ax=1e9,bx2=-1e9,ay=1e9,by=-1e9,mw=0,mh=0,sw=0;
 for(let i=0;i<24;i++){
  const yw=i/24*Math.PI*2,cs=Math.cos(yw),sn=Math.sin(yw);
  let a=1e9,b=-1e9,cc=1e9,d=-1e9;
  for(const pc of all)for(const v of pieceGeom(pc).V){
   const q=prj(v,cs,sn);
   if(q[0]<a)a=q[0];if(q[0]>b)b=q[0];if(q[1]<cc)cc=q[1];if(q[1]>d)d=q[1];}
  if(a<ax)ax=a;if(b>bx2)bx2=b;if(cc<ay)ay=cc;if(d>by)by=d;
  if(b-a>mw)mw=b-a; if(d-cc>mh)mh=d-cc; sw+=b-a;
 }
 f.ax=ax;f.bx=bx2;f.ay=ay;f.by=by;
 // width from the widest single angle, not the union of all of them -- and the
 // pad's corners may bleed a little at 45 degrees rather than shrink the model
 f.pw=Math.max(1,Math.min(mw,sw/24*1.10));
 // height must use the union: the model is centred once, and different angles
 // sit at different heights, so the tallest single angle does not bound them
 f.ph=Math.max(1,by-ay);
 _fpc.set(key,f);return f;
}
function plateOf(f){
 const k='bp_'+f.hw+'_'+f.z0+'_'+f.z1;
 let pl=_bpc.get(k);
 if(!pl){pl=[bx(-f.hw,f.z0,f.hw*2,f.z1-f.z0,-1,1,'#4E9440')];_bpc.set(k,pl);}
 return pl;}
function plateSprite(yaw,ss){
 const f=shipFootprint(),q=Math.round(yaw*24)/24;
 return sprite('bp_'+f.hw+'_'+f.z0+'_'+f.z1+'_'+q.toFixed(3)+'_'+ss,plateOf(f),null,q,ss,true);}

function drawNebula(speed){

   NEB.cv=document.createElement('canvas');NEB.cv.width=bw;NEB.cv.height=bh;
   NEB.w=bw;NEB.h=bh;NEB.g=NEB.cv.getContext('2d');
   NEB.grad={};}
 const g=NEB.g,S=NEB.S;
 g.clearRect(0,0,bw,bh);

 for(const n of nebs){
   n.y+=speed*n.z;if(n.y-n.r>H){n.y=-n.r;n.x=Math.random()*W;}
   const r=n.r/S;
   let gr=NEB.grad[n.col+'|'+n.r];
   if(!gr){gr=g.createRadialGradient(0,0,0,0,0,r);              // built once, then translated
     gr.addColorStop(0,'rgba('+n.col+',1)');gr.addColorStop(0.6,'rgba('+n.col+',0.4)');
     gr.addColorStop(1,'rgba('+n.col+',0)');NEB.grad[n.col+'|'+n.r]=gr;}
   g.save();g.translate(n.x/S,n.y/S);g.globalAlpha=n.a;g.fillStyle=gr;
   g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore();}

}

/* A magnified look at just the part being cycled through, turning on its own,
   so you can see what you are about to fit instead of hunting for the change
   on the finished ship. It gets its own sprite cache so it cannot evict the
   ship's. */
let cardYaw=0.6;
const cardW=()=>Math.min(226,Math.max(132,W*0.42));
const CARD=new Map(), _cardPS=new Map(), _cardBB=new Map();
function partPieces(){
 const sl=SLOTS[activeSlot],i=ship[sl.key];
 if(i<0||sl.key==='theme'||sl.key==='pilot')return null;
 const hull=ship.body>=0?BODIES[ship.body]:null;
 const hw=hull?hull.halfW:4,wy=hull?hull.wingY:2,
       dy=hull?hull.defY:4,dz=hull?hull.defZ:8.6,
       ty=hull?hull.tailY:4,tz=hull?hull.tailZ:15.2;
 const k=sl.key+i+'_'+hw+'_'+wy+'_'+dz+'_'+tz;
 let ps=_cardPS.get(k);
 if(!ps){
   if(sl.key==='body')ps=BODIES[i].pieces;
   else if(sl.key==='cockpit')ps=COCKPITS[i].pieces;
   else if(sl.key==='engine')ps=ENGINES[i].pieces;
   else if(sl.key==='wings')ps=WINGS[i].pieces.length?mirX(place(WINGS[i].pieces,hw,wy)):[];
   else if(sl.key==='tail')ps=placeZ(TAILS[i].pieces,ty,tz);
   else if(sl.key==='defense')ps=placeZ(DEFENSES[i].pieces,dy,dz);
   else ps=[];
   _cardPS.set(k,ps);
 }
 if(!ps.length)return null;
 let bb=_cardBB.get(k);
 if(!bb){
   let ax=1e9,bx2=-1e9,ay=1e9,by=-1e9,mw=0,mh=0;
   for(let j=0;j<24;j++){
     const yw=j/24*Math.PI*2,cs=Math.cos(yw),sn=Math.sin(yw);
     let a=1e9,b2=-1e9,c0=1e9,d0=-1e9;
     for(const q of ps)for(const v of pieceGeom(q).V){const z=prj(v,cs,sn);
       if(z[0]<a)a=z[0];if(z[0]>b2)b2=z[0];if(z[1]<c0)c0=z[1];if(z[1]>d0)d0=z[1];}
     if(a<ax)ax=a;if(b2>bx2)bx2=b2;if(c0<ay)ay=c0;if(d0>by)by=d0;
     if(b2-a>mw)mw=b2-a;if(d0-c0>mh)mh=d0-c0;
   }
   // the widest and tallest the part gets at any single angle -- a tighter
   // bound than the union of all of them, so it fills the card properly
   bb={ax,bx:bx2,ay,by,pw:Math.max(1,mw),ph:Math.max(1,mh)};
   _cardBB.set(k,bb);
 }
 return{k,ps,bb};
}
function roundPath(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
 c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
 c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function drawPartCard(bandTop){
 const info=partPieces();if(!info)return;
 const sl=SLOTS[activeSlot],opt=sl.list[ship[sl.key]];
 const cw=cardW(),ch=cw*0.90;
 const x=W-cw-10,y=bandTop+6;
 ctx.save();
 roundPath(ctx,x,y,cw,ch,13);
 ctx.fillStyle='rgba(10,17,42,0.60)';ctx.fill();
 ctx.strokeStyle='rgba(150,180,220,0.20)';ctx.lineWidth=1;ctx.stroke();
 ctx.clip();
 const q=Math.round(cardYaw*24)/24;
 const bw=info.bb.pw,bh=info.bb.ph;
 const sc=Math.round(Math.min((cw-22)/bw,(ch-36)/bh)*20)/20;
 if(sc>0.05){
   const ss=bakeSS(sc),key=info.k+'_'+q.toFixed(3)+'_'+ss;
   let sp=CARD.get(key);
   if(!sp){sp=makeSprite(info.ps,THEMES[ship.theme],q,ss);CARD.set(key,sp);
     if(CARD.size>30)CARD.clear();}
   if(!sp.empty){
     // the sprite carries its own bounds at THIS angle; the union over all 24
     // angles sets a stable scale but would centre it off to one side
     const mx=x+cw/2-(sp.ox+sp.w/2)*sc,
           my=y+(ch-18)/2-(sp.oy+sp.h/2)*sc;
     ctx.save();ctx.translate(mx,my);ctx.scale(sc,sc);
     ctx.drawImage(sp.cv,sp.ox,sp.oy,sp.w,sp.h);ctx.restore();
   }
 }
 ctx.restore();
 ctx.save();ctx.textAlign='center';
 ctx.font='bold 10px Trebuchet MS';ctx.fillStyle='#9DB4C6';
 ctx.fillText(sl.label,x+cw/2,y+ch-8);
 ctx.restore();
}
function drawBuild(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#101d47');g.addColorStop(0.55,'#0a1230');g.addColorStop(1,'#060a1c');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 drawNebula(0.12);
 for(const s of stars){s.y+=0.15+s.z*0.3;s.tw+=0.05;if(s.y>H){s.y=0;s.x=Math.random()*W;}
   const fl=0.6+0.4*Math.sin(s.tw);
   ctx.fillStyle='rgba(255,255,255,'+(0.2+s.z*0.5)*fl+')';
   ctx.beginPath();ctx.arc(s.x,s.y,s.s*0.7,0,7);ctx.fill();}
 bob+=0.04;
 if(!dragging)buildYaw+=yawSpin;
 // fit pad + model to the free band, instead of a fixed fraction of the screen
 const fp=shipFootprint();
 const bandTop=Math.max(150,uiTop),bandBot=H-158,band=Math.max(120,bandBot-bandTop);
 const empty=!shipPieces().length;
 // an empty pad is scenery, not the subject -- left to fill the band it swamps
 // the screen and swallows the caption
 const cap=empty?1.35:2.9;
 // quantised so a part swap cannot spray the sprite cache with near-identical scales
 // the preview card takes a column on the right; the model gets the rest, so
 // the two never sit on top of each other
 const hasCard=!!partPieces();
 const modelW=hasCard?Math.max(W*0.50,W-cardW()-24):W*0.94;

   Math.round(Math.min(modelW/fp.pw,band*0.92/fp.ph)*20)/20));

 // middle of its column; captions stay on the screen's centre line
 const cxc=hasCard?(W-cardW()-24)*0.5+4:W/2;
 const cx=cxc-(fp.ax+fp.bx)*0.5*sc,
       cy=(empty?bandTop+band*0.62:bandTop+band*0.5)-(fp.ay+fp.by)*0.5*sc;
 if(empty){                                      // an empty pad, waiting
   const ty=bandTop+40;
   ctx.save();ctx.textAlign='center';
   ctx.fillStyle='#1B2A34';
   ctx.font='bold '+Math.floor(Math.min(W,H)*0.052)+'px Trebuchet MS';
   ctx.fillText('BUILD YOUR SHIP',W/2,ty+3);
   ctx.fillStyle='#B9CFE0';ctx.fillText('BUILD YOUR SHIP',W/2,ty);
   ctx.fillStyle='#7E97AB';ctx.font=Math.floor(Math.min(W,H)*0.032)+'px Trebuchet MS';
   ctx.fillText('start with a hull',W/2,ty+35);
   ctx.restore();}
 // The pad used to be a green baseplate. It ate most of the width, forced the
 // model down to a fraction of the screen, and put a big flat slab of one
 // colour behind everything. A soft pool of shadow says "sitting on a surface"
 // just as well and costs nothing.
 if(SHOW_PAD){
   const bp=plateSprite(buildYaw,bakeSS(sc));
   ctx.save();ctx.translate(cx,cy+24);ctx.scale(sc,sc);
   ctx.globalAlpha=0.95;ctx.drawImage(bp.cv,bp.ox,bp.oy,bp.w,bp.h);ctx.globalAlpha=1;ctx.restore();
 }else if(!empty){
   const pr=fp.pw*sc*0.46;
   const pg=ctx.createRadialGradient(cx,cy+34,pr*0.06,cx,cy+34,pr);
   pg.addColorStop(0,'rgba(2,5,16,0.50)');
   pg.addColorStop(0.45,'rgba(2,5,16,0.26)');
   pg.addColorStop(1,'rgba(2,5,16,0)');
   ctx.save();ctx.translate(cx,cy+34);ctx.scale(1,0.30);ctx.translate(-cx,-(cy+34));
   ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy+34,pr,0,7);ctx.fill();ctx.restore();
 }
 if(!empty){                                     // the model's own shadow
   const q=Math.round(buildYaw*24)/24,ss=bakeSS(sc);
   const sp=shipSprite(buildYaw,ss,true);
   if(!sp.empty){
     const shc=shadowOf(sp,'sh'+[ship.cockpit,ship.wings,ship.body,ship.engine,
       ship.tail,ship.defense,ship.pilot].join(',')+q.toFixed(3)+ss);
     const pd=shc.pad/(sp.cv.width/sp.w);   // pad is in the sprite's own units
     ctx.save();ctx.globalAlpha=0.32;
     ctx.translate(cx+10*sc,cy+30);ctx.transform(1,0,-0.45,0.30,0,0);ctx.scale(sc,sc);
     ctx.drawImage(shc,sp.ox-pd,sp.oy-pd,sp.w+pd*2,sp.h+pd*2);
     ctx.restore();
   }
 }
 drawShip(ctx,cx,cy-14+Math.sin(bob)*5,sc,0.45+0.25*Math.sin(bob*2),buildYaw,true);
 cardYaw+=0.010;
 drawPartCard(bandTop);
 drawVignette();
}

 if(fly.trail.length>16)fly.trail.shift();
 for(const t of fly.trail)t.a*=0.9;

 if(isBossLevel(level)&&!fly.bossSpawned&&fly.picked>=Math.floor(fly.goal*0.3)){
   fly.bossSpawned=true;
   fly.boss={x:W/2,y:-120,r:70,hp:BOSS_HP(level),maxHp:BOSS_HP(level),vx:1.6,vy:0.5,hitT:0,fireT:0,sway:0};
   beep(120,0.4,'sawtooth',0.2,40);
 }

 fly.spawnT++;
 // While the boss is up it IS the level: thin the field so rocks can't pile on top of the fight.
 const bossOn=!!fly.boss;
 const every=Math.max(9,34-level*1.35);
 if(fly.spawnT%Math.floor(every)===0){
   const r=Math.random(),gemShare=1-Math.min(0.09,level*0.0045);  // rockier as it climbs
   if(r<0.035){fly.shields.push({x:70+Math.random()*(W-140),y:-30,spin:0});}
   else if(r<0.075){fly.gems.push(mkGem(60+Math.random()*(W-120),-30,true));}
   else if(r<0.235*gemShare){fly.gems.push(mkGem(60+Math.random()*(W-120)));}
   else if(r<0.275*gemShare){const bx=90+Math.random()*(W-180);for(let k=-1;k<=1;k++)fly.gems.push(mkGem(bx+k*46,-30-Math.abs(k)*24));}
   else if(!bossOn||Math.random()<0.35){const w=38+Math.random()*46;fly.obstacles.push({x:60+Math.random()*(W-120),y:-40,w,h:w*0.7,
     hp:w<52?1:(w<70?2:3),hitT:0,vx:level>=6?(Math.random()-0.5)*(1+level*0.07):0,
     spin:Math.random()*7,spinV:(Math.random()-.5)*0.04,rock:(Math.random()*ROCKS.length)|0,sc:w/74});}
 }
 if(!bossOn&&level>=12&&fly.spawnT%Math.floor(every*7)===0){
   for(let k=0;k<6;k++){const w=32+Math.random()*14;
     fly.obstacles.push({x:60+Math.random()*(W-120),y:-40-k*34,w,h:w*0.7,hp:1,hitT:0,
       vx:(Math.random()-0.5)*2.2,spin:Math.random()*7,spinV:(Math.random()-.5)*0.09,
       rock:(Math.random()*ROCKS.length)|0,sc:w/74});}
 }
 if(!bossOn&&level>=2&&fly.spawnT%Math.floor(every*5)===0){
   const dir=Math.random()<0.5?1:-1,sx=dir>0?70:W-70;
   for(let k=0;k<4;k++){const w=40+Math.random()*22;
     fly.obstacles.push({x:sx+dir*k*58,y:-40-k*52,w,h:w*0.7,hp:w<52?1:(w<70?2:3),hitT:0,
       spin:Math.random()*7,spinV:(Math.random()-.5)*0.05,
       rock:(Math.random()*ROCKS.length)|0,sc:w/74});}
 }
 if(!bossOn&&level>=3&&fly.spawnT%Math.floor(every*4)===0){
   const gap=120+Math.random()*60,gx=80+Math.random()*(W-160-gap);
   const drift=level>=10?(Math.random()<0.5?-1:1)*1.1:0;   // the gap slides, later on
   fly.obstacles.push({x:gx-40,y:-50,w:70,h:50,hp:2,hitT:0,vx:drift,spin:0,spinV:0.01,rock:0,sc:70/74});
   fly.obstacles.push({x:gx+gap+40,y:-50,w:70,h:50,hp:2,hitT:0,vx:drift,spin:0,spinV:-0.01,rock:3,sc:70/74});
   fly.gems.push(mkGem(gx+gap/2,-50));
 }

 for(const sp of fly.shields){
   sp.y+=fly.speed;sp.spin+=0.06;
   const dx=sp.x-fly.shipX,dy=sp.y-fly.shipY;
   if(!sp.got&&dx*dx+dy*dy<(52+fly.hitW*0.35)*(52+fly.hitW*0.35)){
     sp.got=true;fly.shield=Math.min(fly.maxShield+3,fly.shield+1);
     powerSound();spawnRing(sp.x,sp.y,'#7FD8FF');spawnBurst(sp.x,sp.y,'#AEEFEC',14);
     const sz=document.getElementById('sz');if(sz)sz.textContent='🛡'.repeat(fly.shield);
   }
 }
 fly.shields=fly.shields.filter(sp=>!sp.got&&sp.y<H+40);

 const magnet=chosenPower==='magnet';
 for(const g of fly.gems){
   g.y+=fly.speed;g.spin+=0.05;
   if(!g.got){
     const dx=g.x-fly.shipX,dy=g.y-fly.shipY;
     if(magnet){const d=Math.hypot(dx,dy);if(d<190){g.x-=dx/d*3.4;g.y-=dy/d*1.6;}}
     const grabR=(g.gold?52:46)+fly.hitW*0.35;
     if(dx*dx+dy*dy<grabR*grabR){
       g.got=true;fly.combo++;fly.comboT=90;fly.maxCombo=Math.max(fly.maxCombo,fly.combo);
       const base=g.gold?5:1;
       const gain=fly.scorePerGem*base*(1+Math.min(4,Math.floor(fly.combo/3)));
       fly.crystals+=gain;totalCrystals+=gain;fly.picked+=g.gold?3:1;
       if(g.gold){goldSound();spawnBurst(g.x,g.y,'#F2CD37',22);spawnRing(g.x,g.y,'#F2CD37');}
       else{grabSound(Math.min(6,fly.combo));spawnBurst(g.x,g.y,'#56E646',12);spawnRing(g.x,g.y,'#9BF08A');}
       const cz=document.getElementById('cz');if(cz){cz.textContent=fly.picked+' / '+fly.goal;cz.style.transform='scale(1.3)';setTimeout(()=>cz.style.transform='scale(1)',110);}
       const sc2=document.getElementById('score');if(sc2)sc2.textContent='💎 '+fly.crystals;
       const cb=document.getElementById('combo');if(cb)cb.textContent=fly.combo>=2?'COMBO x'+fly.combo:'';
       if(fly.picked>=fly.goal&&!(fly.boss&&fly.boss.hp>0))winMission();
     }
   }
 }
 fly.gems=fly.gems.filter(g=>g.y<H+40&&!g.got);

 for(const o of fly.obstacles){
   o.y+=fly.speed;o.spin+=o.spinV;if(o.hitT>0)o.hitT--;
   if(o.vx){o.x+=o.vx;if(o.x<44||o.x>W-44)o.vx*=-1;}
   if(fly.invuln<=0){const pad=o.w*0.30;
     const dx=(o.x-fly.shipX)/(fly.hitW+pad),dy=(o.y-fly.shipY)/(fly.hitH+pad);
     if(dx*dx+dy*dy<1)hitShip();}
 }
 fly.obstacles=fly.obstacles.filter(o=>o.y<H+60);

 const D=ship.defense>=0?DEFENSES[ship.defense]:{rate:0};
 if(D.rate){
   fly.fireT++;
   if(fly.fireT%D.rate===0){
     if(D.ring)fly.pulses.push({x:fly.shipX,y:fly.shipY-10,r:16,max:265,dmg:D.dmg,col:D.col});
     else for(const b of D.bolts)
       fly.bolts.push({x:fly.shipX+b.x*3.2,y:fly.shipY-18,vx:b.vx,vy:-13,
         dmg:D.dmg,col:D.col,big:D.big});
     beep(D.big?300:520,0.04,'square',0.07,D.big?-120:180);
   }
 }
 for(const b of fly.bolts){b.x+=b.vx;b.y+=b.vy;}
 for(const pu of fly.pulses){pu.r+=5.2;pu.y-=4.4;}
 fly.pulses=fly.pulses.filter(pu=>pu.r<pu.max);
 const breakRock=(o,at)=>{
   spawnBurst(at.x,at.y,'#C8B49A',9);
   if(--o.hp<=0){
     o.dead=true;spawnBurst(o.x,o.y,'#A08868',26);spawnRing(o.x,o.y,'#DEC69C');
     beep(150,0.16,'square',0.14,-70);fly.shake=Math.max(fly.shake,5);
     if(Math.random()<0.22)fly.gems.push(mkGem(o.x,o.y));
     else if(Math.random()<0.14)fly.shields.push({x:o.x,y:o.y,spin:0});
     if(level>=14&&o.w>62)                                  // big ones split in two
       for(const sx of[-1,1]){const w2=o.w*0.5;
         fly.obstacles.push({x:o.x+sx*o.w*0.3,y:o.y,w:w2,h:w2*0.7,hp:1,hitT:0,
           vx:sx*1.3,spin:Math.random()*7,spinV:(Math.random()-.5)*0.07,
           rock:(Math.random()*ROCKS.length)|0,sc:w2/74});}
   }else o.hitT=6;
 };
 for(const b of fly.bolts){
   for(const o of fly.obstacles){
     if(o.dead)continue;
     const dx=o.x-b.x,dy=o.y-b.y,rr2=o.w*0.34;
     if(dx*dx+dy*dy<rr2*rr2){b.dead=true;breakRock(o,b);break;}
   }
   if(!b.dead&&fly.boss){const bs=fly.boss,dx=bs.x-b.x,dy=bs.y-b.y;
     if(dx*dx+dy*dy<bs.r*bs.r){b.dead=true;bs.hp-=b.dmg;bs.hitT=8;bossHitSound();
       spawnBurst(b.x,b.y,'#FE8A18',10);
       if(bs.hp<=0){spawnBurst(bs.x,bs.y,'#F2CD37',50);fly.shake=16;fly.boss=null;
         if(fly.picked>=fly.goal)winMission();}}}
 }
 for(const pu of fly.pulses){
   for(const o of fly.obstacles){
     if(o.dead||o.pulsed===pu)continue;
     const d=Math.hypot(o.x-pu.x,o.y-pu.y);
     if(Math.abs(d-pu.r)<o.w*0.4){o.pulsed=pu;breakRock(o,{x:o.x,y:o.y});}
   }
   if(fly.boss&&!pu.hitBoss){const d=Math.hypot(fly.boss.x-pu.x,fly.boss.y-pu.y);
     if(Math.abs(d-pu.r)<fly.boss.r){pu.hitBoss=true;fly.boss.hp-=pu.dmg;fly.boss.hitT=8;
       bossHitSound();
       if(fly.boss.hp<=0){spawnBurst(fly.boss.x,fly.boss.y,'#F2CD37',50);fly.shake=16;
         fly.boss=null;if(fly.picked>=fly.goal)winMission();}}}
 }
 fly.bolts=fly.bolts.filter(b=>!b.dead&&b.y>-30&&b.x>-30&&b.x<W+30);
 fly.obstacles=fly.obstacles.filter(o=>!o.dead);

 if(fly.boss){
   const b=fly.boss;b.sway+=0.03;
   if(b.y<H*0.22)b.y+=b.vy*fly.speed*0.4;else{b.x+=b.vx*2.2;if(b.x<b.r+20||b.x>W-b.r-20)b.vx*=-1;}
   if(b.hitT>0)b.hitT--;
   if(fly.invuln<=0){const pad=b.r*0.66;
     const dx=(b.x-fly.shipX)/(fly.hitW+pad),dy=(b.y-fly.shipY)/(fly.hitH+pad);
     if(dx*dx+dy*dy<1)hitShip();}
   b.fireT++;
 }
 updateParticles();
}
function hitShip(){fly.shield--;fly.invuln=58;fly.combo=0;fly.shake=14;
 crashSound();spawnBurst(fly.shipX,fly.shipY,'#FE8A18',20);
 const sz=document.getElementById('sz');if(sz)sz.textContent='🛡'.repeat(Math.max(0,fly.shield))||'💀';
 const cb=document.getElementById('combo');if(cb)cb.textContent='';
 if(fly.shield<=0)loseMission();}
function mkGem(x,y=-30,gold=false){return{x,y,r:gold?17:14,spin:Math.random()*7,got:false,gold};}
function spawnBurst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=Math.random()*5+1;
  fly.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,max:30,color,r:Math.random()*3+1});}}
function spawnRing(x,y,color){fly.particles.push({x,y,vx:0,vy:0,life:18,max:18,color,ring:true,r:8});}
function updateParticles(){for(const p of fly.particles){if(p.ring){p.r+=3.2;p.life--;continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;}
  fly.particles=fly.particles.filter(p=>p.life>0);}
function winMission(){if(fly.over)return;fly.over=true;fly.win=true;fly.overT=0;fly.shake=8;
  hiCombo=Math.max(hiCombo,fly.maxCombo);hiScore=Math.max(hiScore,totalCrystals);hiLevel=Math.max(hiLevel,level);
  winSound();spawnBurst(fly.shipX,fly.shipY,'#57A93B',40);}
function loseMission(){if(fly.over)return;fly.over=true;fly.win=false;fly.overT=0;fly.shake=18;
  hiScore=Math.max(hiScore,totalCrystals);hiCombo=Math.max(hiCombo,fly.maxCombo);
  spawnBurst(fly.shipX,fly.shipY,'#C91A09',50);}
function afterMission(){
 if(fly.win){
   if(level>=MAX_LEVEL){scene=SCENE.BUILD;level=1;unlockPoints=Math.max(unlockPoints,MAX_LEVEL);activeSlot=0;buildUI();return;}
   level++;unlockPoints++;
 }
 scene=SCENE.BUILD;activeSlot=0;buildUI();
}
function nextUnlockPreview(){const nx=unlockPoints+1;
 for(const s of SLOTS)for(const it of s.list)if((it.unlock||0)===nx)return it.name;return null;}

/* ---------- flight rendering ---------- */
function drawFly(){
 ctx.save();
 if(fly.shake>0.5)ctx.translate((Math.random()-0.5)*fly.shake,(Math.random()-0.5)*fly.shake);
 const bgf=ctx.createLinearGradient(0,0,0,H);
 bgf.addColorStop(0,'#0b1435');bgf.addColorStop(0.6,'#080f26');bgf.addColorStop(1,'#04060f');
 ctx.fillStyle=bgf;ctx.fillRect(-20,-20,W+40,H+40);
 drawPlanet();
 drawNebula(fly.speed*0.4);
 for(const s of stars){s.y+=fly.speed*(0.3+s.z*0.9);if(s.y>H){s.y=0;s.x=Math.random()*W;}}
 for(let bk=0;bk<3;bk++){
   ctx.strokeStyle='rgba(170,205,255,'+(0.16+bk*0.13)+')';ctx.lineWidth=0.8+bk*0.55;
   ctx.beginPath();
   for(const s of stars){if(((s.z*3)|0)!==bk)continue;
     ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+fly.speed*(1+s.z*2));}
   ctx.stroke();}
 const TC=THEMES[ship.theme];

 for(const g of fly.gems){if(!g.got)drawCrystal(g.x,g.y,g.r,g.spin,g.gold);}
 for(const o of fly.obstacles)drawRock(o);
 for(const sp of fly.shields)drawShieldPickup(sp);
 if(fly.boss)drawBoss(fly.boss);

 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<fly.trail.length;i++){const t=fly.trail[i],f=i/fly.trail.length;
   ctx.globalAlpha=t.a*0.45*f;ctx.fillStyle=TC.flame2;ctx.beginPath();ctx.arc(t.x,t.y,9*t.a*f,0,7);ctx.fill();
   ctx.globalAlpha=t.a*0.85*f;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(t.x,t.y,3.5*t.a*f,0,7);ctx.fill();}
 ctx.restore();ctx.globalAlpha=1;
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const b of fly.bolts){const L=b.big?26:16,w=b.big?5:3;
   const g=ctx.createLinearGradient(b.x,b.y-L,b.x,b.y+L*0.4);
   g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.45,'#ffffff');
   g.addColorStop(1,hexA(b.col,0));
   ctx.fillStyle=g;ctx.fillRect(b.x-w/2,b.y-L,w,L*1.4);
   ctx.fillStyle=hexA(b.col,0.85);ctx.fillRect(b.x-w,b.y-L*0.75,w*2,L*0.95);}
 for(const pu of fly.pulses){const a=1-pu.r/pu.max;
   ctx.strokeStyle=hexA(pu.col,a*0.9);ctx.lineWidth=4*a+1;
   ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r,0,7);ctx.stroke();
   ctx.strokeStyle=hexA('#ffffff',a*0.5);ctx.lineWidth=1.5;
   ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r-3,0,7);ctx.stroke();}
 ctx.restore();

 const blink=fly.invuln>0&&Math.floor(fly.invuln/5)%2===0;
 if(!(fly.over&&!fly.win)&&!blink)
   drawShip(ctx,fly.shipX,fly.shipY,Math.min(W,H)/360*0.52,0.9,fly.tilt*1.5);

 for(const p of fly.particles){
   if(p.ring){ctx.save();ctx.globalAlpha=p.life/p.max;ctx.globalCompositeOperation='lighter';
     ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();ctx.restore();continue;}
   ctx.save();ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.restore();}
 noGlow(ctx);
 drawVignette();
 ctx.restore();

 if(fly.over){
   ctx.save();ctx.fillStyle='rgba(0,0,0,'+Math.min(0.7,fly.overT/40)+')';ctx.fillRect(0,0,W,H);
   if(fly.overT>20){ctx.textAlign='center';
     if(fly.win){const done=level>=MAX_LEVEL;
       ctx.fillStyle='#1B2A34';ctx.font='bold '+Math.floor(W*0.085)+'px Trebuchet MS';
       ctx.fillText(done?'YOU WON! 🏆':'ARRIVED AT '+planetFor(level).n,W/2,H*0.32+4);
       ctx.fillStyle='#57A93B';ctx.fillText(done?'YOU WON! 🏆':'ARRIVED AT '+planetFor(level).n,W/2,H*0.32);
       ctx.fillStyle='#fff';ctx.font=Math.floor(W*0.036)+'px Trebuchet MS';
       ctx.fillText(fly.crystals+' crystals'+(fly.maxCombo>=3?'  ·  combo x'+fly.maxCombo:''),W/2,H*0.41);
       if(done){ctx.fillStyle='#F2CD37';ctx.font=Math.floor(W*0.03)+'px Trebuchet MS';
         ctx.fillText('All '+MAX_LEVEL+' levels complete! Every part unlocked.',W/2,H*0.48);}
       else if(nextUnlockPreview()){ctx.fillStyle='#F2CD37';
         ctx.font='bold '+Math.floor(W*0.036)+'px Trebuchet MS';
         ctx.fillText('🔓 UNLOCKED: '+nextUnlockPreview(),W/2,H*0.49);}
     } else {
       ctx.fillStyle='#1B2A34';ctx.font='bold '+Math.floor(W*0.085)+'px Trebuchet MS';
       ctx.fillText('SHIP DOWN!',W/2,H*0.36+4);
       ctx.fillStyle='#C91A09';ctx.fillText('SHIP DOWN!',W/2,H*0.36);
       ctx.fillStyle='#fff';ctx.font=Math.floor(W*0.034)+'px Trebuchet MS';
       ctx.fillText('Got '+fly.picked+' of '+fly.goal+' gems — try again!',W/2,H*0.44);}
     ctx.fillStyle='#F2CD37';ctx.font=Math.floor(W*0.026)+'px Trebuchet MS';
     ctx.fillText('★ Best: '+hiScore+' crystals · Lv '+hiLevel+' · combo x'+hiCombo,W/2,H*0.55);
     if(fly.overT>40&&Math.floor(fly.overT/30)%2===0){ctx.fillStyle='#fff';
       ctx.font='bold '+Math.floor(W*0.032)+'px Trebuchet MS';
       ctx.fillText(fly.win?(level>=MAX_LEVEL?'TAP TO PLAY AGAIN':'TAP TO UPGRADE SHIP'):'TAP TO RETRY',W/2,H*0.63);}
   }
   ctx.restore();
 }
}
const HALOIMG={};
function haloImg(base){if(HALOIMG[base])return HALOIMG[base];
 const S=128,cv=document.createElement('canvas');cv.width=cv.height=S;
 const g=cv.getContext('2d'),gr=g.createRadialGradient(S/2,S/2,1,S/2,S/2,S/2);
 gr.addColorStop(0,hexA(base,1));gr.addColorStop(1,hexA(base,0));
 g.fillStyle=gr;g.fillRect(0,0,S,S);HALOIMG[base]=cv;return cv;}
const GEMSPR={};
function gemSprite(base,r){
 const k=base+'|'+r;let c=GEMSPR[k];if(c)return c;
 const S=Math.ceil(r*2.8),SS=2;
 const cv=document.createElement('canvas');cv.width=cv.height=S*SS;
 const g=cv.getContext('2d');g.setTransform(SS,0,0,SS,0,0);g.translate(S/2,S/2);
 const P=[[0,-r],[r*0.66,-r*0.2],[r*0.42,r],[-r*0.42,r],[-r*0.66,-r*0.2]];
 const path=x=>{x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();};
 g.globalAlpha=0.93;
 g.fillStyle=shade(base,-0.18);path(g);g.fill();
 g.fillStyle=shade(base,0.38);
 g.beginPath();g.moveTo(0,-r);g.lineTo(-r*0.66,-r*0.2);g.lineTo(0,-r*0.2);g.closePath();g.fill();
 g.fillStyle=shade(base,0.14);
 g.beginPath();g.moveTo(-r*0.66,-r*0.2);g.lineTo(0,-r*0.2);g.lineTo(-r*0.42,r);g.closePath();g.fill();
 g.globalAlpha=1;g.lineJoin='round';g.strokeStyle=shade(base,-0.5);g.lineWidth=1.2;
 path(g);g.stroke();
 g.beginPath();g.moveTo(-r*0.66,-r*0.2);g.lineTo(r*0.66,-r*0.2);g.stroke();
 c={cv,S};GEMSPR[k]=c;return c;
}
// a moulded trans jewel: flat facets, one hard specular. No soft glow.
function drawCrystal(x,y,r,spin,gold){
 const base=gold?'#F2CD37':'#56E646',tw=0.7+0.3*Math.sin(spin*3);
 ctx.save();ctx.translate(x,y);
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.4*tw;
 const R=r*2.4;ctx.drawImage(haloImg(base),-R,-R,R*2,R*2);ctx.restore();
 ctx.rotate(Math.sin(spin)*0.4);
 const sp=gemSprite(base,r);ctx.drawImage(sp.cv,-sp.S/2,-sp.S/2,sp.S,sp.S);
 ctx.fillStyle='rgba(255,255,255,'+(0.5+0.35*tw)+')';
 ctx.beginPath();ctx.ellipse(-r*0.27,-r*0.44,r*0.13,r*0.3,0.3,0,7);ctx.fill();
 ctx.restore();
}
const ROCKSPR=[];
// a trans-blue shield brick -- reads as "grab me", not as a rock
function drawShieldPickup(sp){
 const b=0.75+0.25*Math.sin(sp.spin*2.4);
 ctx.save();ctx.translate(sp.x,sp.y);
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.42*b;
 ctx.drawImage(haloImg('#7FD8FF'),-38,-38,76,76);ctx.restore();
 ctx.rotate(Math.sin(sp.spin)*0.28);
 const R=13;
 ctx.globalAlpha=0.9;
 ctx.fillStyle=shade('#7FD8FF',-0.15);
 ctx.beginPath();ctx.moveTo(0,-R);ctx.lineTo(R*0.85,-R*0.45);
 ctx.lineTo(R*0.7,R*0.55);ctx.lineTo(0,R);ctx.lineTo(-R*0.7,R*0.55);
 ctx.lineTo(-R*0.85,-R*0.45);ctx.closePath();ctx.fill();
 ctx.globalAlpha=1;
 ctx.strokeStyle=shade('#7FD8FF',-0.45);ctx.lineWidth=1.4;ctx.lineJoin='round';ctx.stroke();
 ctx.fillStyle='#F4F4F4';
 ctx.fillRect(-R*0.17,-R*0.55,R*0.34,R*1.1);
 ctx.fillRect(-R*0.5,-R*0.17,R*1.0,R*0.34);
 ctx.fillStyle='rgba(255,255,255,'+(0.45+0.35*b)+')';
 ctx.beginPath();ctx.ellipse(-R*0.3,-R*0.42,R*0.16,R*0.3,0.3,0,7);ctx.fill();
 ctx.restore();
}
function drawRock(o){
 let s=ROCKSPR[o.rock];
 if(!s)s=ROCKSPR[o.rock]=makeSprite(ROCKS[o.rock],null,0.45);
 // rocks are small, tumbling and numerous -- smoothing the rotation of 40 of
 // them costs more than it shows
 ctx.save();ctx.imageSmoothingEnabled=false;
 ctx.translate(o.x,o.y);ctx.rotate(o.spin);ctx.scale(o.sc,o.sc);
 ctx.drawImage(s.cv,s.ox,s.oy,s.w,s.h);
 if(o.hitT>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=o.hitT/9;
   ctx.drawImage(s.cv,s.ox,s.oy,s.w,s.h);}
 ctx.restore();
}
function drawBoss(b){
 const sc=b.r/95,yaw=Math.sin(b.sway)*0.35,cs=Math.cos(yaw),sn=Math.sin(yaw);
 ctx.save();ctx.translate(b.x,b.y);ctx.scale(sc,sc);
 if(b.hitT>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;}
 drawPieces(ctx,BOSS_BRICKS,null,yaw);
 if(b.hitT>0)ctx.restore();
 // eyes -- the only thing in the scene still allowed to glow
 glow(ctx,'#FFDD00',18);ctx.fillStyle='#FFEE44';
 for(const e of[[-5,7],[5,7]]){const p=prj([e[0]*STUD,17*PLATE-CY,e[1]*STUD-CZ],cs,sn);
   ctx.beginPath();ctx.arc(p[0],p[1],9,0,7);ctx.fill();}
 noGlow(ctx);ctx.fillStyle='#1B2A34';
 for(const e of[[-5,7],[5,7]]){const p=prj([e[0]*STUD,17*PLATE-CY,e[1]*STUD-CZ],cs,sn);
   ctx.beginPath();ctx.arc(p[0],p[1]+1,3.4,0,7);ctx.fill();}
 ctx.restore();
 ctx.save();ctx.translate(b.x,b.y);
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-b.r,-b.r-18,b.r*2,8);
 ctx.fillStyle='#C91A09';ctx.fillRect(-b.r,-b.r-18,b.r*2*(b.hp/b.maxHp),8);
 ctx.strokeStyle='#1B2A34';ctx.lineWidth=1.5;ctx.strokeRect(-b.r,-b.r-18,b.r*2,8);
 ctx.restore();
}

addEventListener('pointerdown',()=>{if(scene===SCENE.FLY&&fly.over&&fly.overT>40)afterMission();});

let acc=0,last=performance.now();const STEP=1000/60;
let slowRun=0,fpsN=0,fpsT=0;
function loop(now){requestAnimationFrame(loop);
 const dt=now-last;acc+=dt;last=now;
 // watch the frame rate and drop resolution rather than drop frames
 fpsN++;fpsT+=dt;
 if(fpsT>900){
   const fps=fpsN/(fpsT/1000);fpsN=0;fpsT=0;
   const k=scene===SCENE.FLY?'fly':'build',floor=scene===SCENE.FLY?2:1.5;
   if(fps<38){if(++slowRun>=2&&dprCap[k]>floor){
     dprCap[k]=Math.max(floor,dprCap[k]-0.5);slowRun=0;}}
   else slowRun=0;
 }
 applyDPR(Math.min(DEV(),scene===SCENE.FLY?dprCap.fly:dprCap.build));
 let steps=Math.min(Math.floor(acc/STEP),5);
 try{while(steps-->0){if(scene===SCENE.FLY)updateFly();}}
 catch(e){window.__oops('the game loop',e);}
 acc%=STEP;
 try{
   if(scene===SCENE.FLY)drawFly();else drawBuild();
 }catch(e){window.__oops(scene===SCENE.FLY?'flight':'the build screen',e);}
}
buildUI();requestAnimationFrame(loop);
</script>
